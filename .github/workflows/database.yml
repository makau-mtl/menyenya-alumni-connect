# Applies new database changes (supabase/migrations) to the Supabase project
# whenever they reach the main branch.
#
# Needs one repository secret:
#   SUPABASE_DB_URL – the Session pooler connection string from Supabase
#                     (Connect → Connection string → Session pooler), with the
#                     database password filled in.
# The session pooler is used because GitHub's machines only support IPv4.
name: Database

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency: database-migrations

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the connection string is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (see docs/SETUP-SUPABASE.md)."
            exit 1
          fi
      - name: Apply new migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
